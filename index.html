<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Carts | Small Space Supply</title>
<meta name="description" content="An interactive shopping study for comparing and ordering a rolling storage cart.">
<style>
:root{color-scheme:light;--ink:#1e2d27;--muted:#506157;--paper:#f7f8f2;--line:#cbd5cd;--green:#204f3b;--pale:#eaf1e7;--white:#fff;--amber:#fff3db;--amber-line:#b47730;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper)}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible+span{outline:3px solid #a54b15;outline-offset:4px}
.shell{width:min(1100px,calc(100% - 64px));margin-inline:auto}
.top{background:#e8eee2;border-bottom:1px solid var(--line)}
.header,.foot,.actions,.row,.lineitem,.brand{display:flex;align-items:center}
.header,.foot,.row{justify-content:space-between;gap:16px}
.header{min-height:72px}
.brand{gap:12px;font-size:1.125rem;font-weight:730;letter-spacing:-.025em}
.brand small{display:block;font-size:.78rem;letter-spacing:.035em;font-weight:550;color:var(--muted)}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;font-family:Georgia,serif;font-size:1.05rem;letter-spacing:-.08em}
.reset,.link{color:var(--green);font-weight:700;background:transparent;border:0;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
main{min-height:570px;padding-block:25px 36px}
.foot{padding:14px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.steps{margin:0 0 24px;padding:0;display:flex;gap:8px 24px;flex-wrap:wrap;list-style:none;font-size:.88rem;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:7px}
.steps span{display:grid;place-items:center;border:1px solid #aebbb1;border-radius:50%;width:23px;height:23px;font-size:.76rem}
.steps [aria-current]{font-weight:750;color:var(--green)}
.steps [aria-current] span{color:#fff;background:var(--green);border-color:var(--green)}
h1,h2,p{margin:0}
h1{font:500 clamp(2.5rem,5vw,4rem)/1.04 Georgia,serif;letter-spacing:-.06em}
h1:focus{outline:none}
h2{font-size:1.16rem;letter-spacing:-.02em}
.lead{margin:10px 0 23px;color:var(--muted);font-size:1.03rem}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card,.panel,.cost,.option{background:#fff;border:1px solid var(--line);border-radius:16px}
.card{overflow:hidden}
.card .photo{height:195px}
.photo{background:#edf0e9;display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;min-height:0;object-fit:contain;mix-blend-mode:multiply}
.card .photo img{max-height:195px}
.card-body{padding:16px 17px}
.card-body .row{align-items:baseline}
.tag{font-size:.84rem;color:var(--muted);font-weight:600}
.dims{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0;gap:8px}
.dims div{border-top:1px solid var(--line);padding-top:7px}
.dims dt{font-size:.78rem;color:var(--muted)}
.dims dd{margin:0;font-size:.94rem;font-weight:700}
.primary,.secondary{border:1px solid var(--green);padding:10px 16px;border-radius:9px;font-weight:720;line-height:1.35;min-height:44px}
.primary{color:#fff;background:var(--green)}
.primary:hover{background:#153e2b}
.secondary{color:var(--green);background:#fff}
.secondary:hover{background:var(--pale)}
.two{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(275px,1fr);gap:20px;align-items:start}
.detail{grid-template-columns:minmax(0,.86fr) minmax(0,1fr)}
.detail .photo{height:385px;border-radius:16px;border:1px solid var(--line)}
.detail .photo img{max-height:385px}
.detail .panel{min-height:385px}
.panel,.cost{padding:20px 22px}
.panel+.panel{margin-top:14px}
.panel p{margin-top:5px;color:var(--muted)}
.price{font-size:1.38rem;font-weight:760}
fieldset{padding:0;border:0;margin:14px 0 18px}
legend{font-weight:750;margin-bottom:8px}
.finishes{display:flex;gap:8px;flex-wrap:wrap}
.choice{position:relative;display:block}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice>span{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;cursor:pointer}
.choice input:checked+span{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--pale)}
.dot{width:15px;height:15px;border-radius:50%;border:1px solid #78867d}
.actions{gap:10px 16px;flex-wrap:wrap;margin-top:16px}
.lineitem{gap:16px;align-items:center}
.lineitem .photo{width:92px;height:90px;flex:none;border-radius:8px}
.lineitem .photo img{max-height:90px}
.lineitem .copy{flex:1;min-width:0}
.lineitem .copy p{margin:1px 0;font-size:.91rem}
.lineitem .link{margin-top:4px}
.cost dl{margin:10px 0 0}
.cost dl div{display:flex;justify-content:space-between;gap:14px;padding:6px 0}
.cost dd{margin:0;text-align:right}
.cost dl .total{border-top:1px solid var(--line);margin-top:7px;padding-top:10px;font-size:1.12rem;font-weight:760}
.cost .primary{width:100%;margin-top:12px}
.note{font-size:.86rem;color:var(--muted);margin-top:8px}
.option{margin:0 0 10px}
.option>span{justify-content:space-between;padding:13px 15px}
.option strong,.option small{display:block}
.option small{font-size:.86rem;color:var(--muted)}
.warning,.success{padding:14px 18px;margin-bottom:16px;border:1px solid var(--amber-line);border-radius:12px;background:var(--amber)}
.success{background:var(--pale);border-color:#85a88c}
.warning p,.success p{margin-top:3px}
.receipt{font-size:.85rem;color:var(--muted);font-weight:680}
dialog{max-width:min(480px,calc(100% - 30px));border:1px solid var(--line);border-radius:16px;padding:25px;color:var(--ink);background:var(--paper)}
dialog p{margin-top:8px}
dialog::backdrop{background:#18292280}
@media(max-width:750px){.shell{width:calc(100% - 32px)}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.detail .photo,.detail .photo img{height:240px}.header{min-height:64px}.steps{gap:8px 12px}.steps li{gap:4px}.foot{align-items:flex-start}.reset{font-size:.88rem}.lineitem .photo{width:69px;height:75px}}

</style>

</head>
<body>
<header class="top"><div class="shell header">
  <div class="brand"><span class="mark" aria-hidden="true">SS</span><span>Small Space Supply<small>Shopping prototype</small></span></div>
  <button class="reset" type="button" data-action="reset">Reset prototype</button>
</div></header>
<main class="shell" id="shop"></main>
<footer class="shell foot"><span>Pre-test v1</span><span>Simulated shopping · Product imagery from IKEA</span></footer>
<dialog id="reset-dialog"><form method="dialog"><h2>Reset this prototype?</h2><p>This clears your product, finish, and fulfillment choices.</p><div class="actions"><button class="secondary" value="cancel" autofocus>Keep shopping</button><button class="primary" value="reset">Reset and start over</button></div></form></dialog>

};
const products = {
  standard: { name: 'RÅSKOG', size: 'Standard cart', width: '17¾″', depth: '13¾″', height: '30⅜″', cents: 3999, finishes: ['black', 'white', 'red'], description: 'Three steel trays and lockable wheels for a kitchen or desk.' },
  compact: { name: 'RÅSKOG', size: 'Compact cart', width: '15″', depth: '11″', height: '24″', cents: 2999, finishes: ['small'], description: 'Three steel trays in a lower profile that fits under many worktops.' },
  wide: { name: 'NISSAFORS', size: 'Wide cart', width: '19⅞″', depth: '11¾″', height: '32⅝″', cents: 2999, finishes: ['wide'], description: 'Three steel trays with extra room across the long side.' },
};
const finishes = {
  black: ['Black', '#303532'], white: ['White', '#fafbf7'], red: ['Red-brown', '#9e4b37'],
  small: ['Gray-green', '#738279'], wide: ['Black', '#303532'],
};
const methods = {
  pickup: { title: 'Tempe store pickup', detail: 'Tomorrow, 12–6 PM · Tempe, AZ', fee: 200 },
  delivery: { title: 'Home delivery', detail: 'In 3–5 days · sample Tempe address', fee: 999 },
};
const target = document.querySelector('#shop');
const dialog = document.querySelector('#reset-dialog');
const currency = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD'});
const money = cents => currency.format(cents / 100);
const initial = () => ({screen:1, bag:null, method:'pickup', draft:null, returnTo:1, checked:false});
let state = initial();
const button = (label, action, style='primary', value='') =>
  `<button type="button" class="${style}" data-action="${action}" data-value="${value}">${label}</button>`;
const img = (finish, name) => `<div class="photo"><img src="${photoData[finish]}" alt="${finishes[finish][0]} ${name} rolling cart"></div>`;
const totalFor = (product, method) => {
  const subtotal = product.cents;
  const fee = methods[method].fee;
  const tax = Math.round(subtotal * .08);
  return {subtotal, fee, tax, total:subtotal+fee+tax};
};
function dimensions(product) {
  return `<dl class="dims">${[['Width',product.width],['Depth',product.depth],['Height',product.height]].map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>`;
}
function heading(title, copy) {
  return `<h1 tabindex="-1">${title}</h1><p class="lead">${copy}</p>`;
}
function steps() {
  const current = [0,1,1,2,3,3,4,5][state.screen];
  return `<ol class="steps" aria-label="Checkout progress">${['Explore','Bag','Fulfillment','Review','Done'].map((step,i)=>`<li ${current===i+1?'aria-current="step"':''}><span aria-hidden="true">${i+1}</span>${step}</li>`).join('')}</ol>`;
}
function catalog() {
  return heading('Rolling storage carts','Compare the width, depth, and height before choosing a cart.')+
    `<div class="grid">${Object.entries(products).map(([id,p])=>`<article class="card">${img(p.finishes[0],p.name)}<div class="card-body"><div class="row"><h2>${p.name}</h2><strong>${money(p.cents)}</strong></div><p class="tag">${p.size}</p>${dimensions(p)}${button('View '+p.size.toLowerCase(),'view','secondary',id)}</div></article>`).join('')}</div>`;
}
function detail() {
  const p=products[state.draft.id];
  return heading(p.name,p.size)+`<div class="two detail">${img(state.draft.finish,p.name)}<section class="panel"><div class="row"><h2>Product details</h2><span class="price">${money(p.cents)}</span></div><p>${p.description}</p>${dimensions(p)}<fieldset><legend>Finish</legend><div class="finishes">${p.finishes.map(f=>`<label class="choice"><input type="radio" name="finish" value="${f}" ${f===state.draft.finish?'checked':''}><span><i class="dot" aria-hidden="true" style="background:${finishes[f][1]}"></i>${finishes[f][0]}</span></label>`).join('')}</div></fieldset><p class="note">Pickup availability is checked when you choose fulfillment.</p><div class="actions">${button(state.returnTo===1?'Add to bag':'Save selection','save')}${button(state.returnTo===1?'Back to carts':'Cancel changes','cancel','link')}</div></section></div>`;
}
function item(edit=false) {
  const {id,finish}=state.bag;
  const p=products[id];
  return `<section class="panel lineitem">${img(finish,p.name)}<div class="copy"><h2>${p.name} <span class="tag">· ${p.size}</span></h2><p>${finishes[finish][0]} · Quantity 1</p><p>${p.width} wide × ${p.depth} deep × ${p.height} high</p>${edit?button('Change finish','edit','link'):''}</div><strong>${money(p.cents)}</strong></section>`;
}
function costs(label='',action='',estimate=false) {
  const p=products[state.bag.id];
  const {subtotal,fee,tax,total}=totalFor(p,state.method);
  return `<aside class="cost"><h2>${estimate?'Cost estimate':'Order total'}</h2><dl><div><dt>Item subtotal</dt><dd>${money(subtotal)}</dd></div><div><dt>${state.method==='pickup'?'Tempe pickup':'Home delivery'}</dt><dd>${money(fee)}</dd></div><div><dt>Tax</dt><dd>${money(tax)}</dd></div><div class="total"><dt>${estimate?'Estimated total':'Total'}</dt><dd>${money(total)}</dd></div></dl>${estimate?'<p class="note">Availability and fulfillment are confirmed before order review.</p>':''}${label?button(label,action):''}</aside>`;
}
function bag() {
  return heading('Your bag','Review your cart and finish before choosing pickup or delivery.')+`<div class="two"><div>${item(true)}<div class="actions">${button('Back to carts','browse','link')}</div></div>${costs('Choose pickup or delivery','fulfill',true)}</div>`;
}
function fulfillment() {
  return heading('Pickup or delivery','Choose how you want to receive your cart.')+
    `<div class="two"><div>${item()}<fieldset><legend>Fulfillment method</legend>${Object.entries(methods).map(([key,m])=>`<label class="choice option"><input type="radio" name="method" value="${key}" ${state.method===key?'checked':''}><span><span><strong>${m.title}</strong><small>${m.detail}</small></span><strong>${money(m.fee)}</strong></span></label>`).join('')}</fieldset><div class="actions">${button('Back to bag','bag','link')}</div></div>${costs('Check availability','check',true)}</div>`;
}
function recovery() {
  const p=products[state.bag.id];
  return heading('Pickup availability changed','Your bag still contains the original cart.')+
    `<div class="two"><div><div class="warning"><h2>Black is unavailable for Tempe pickup</h2><p>The same size is available in White or Red-brown at the same price.</p></div><section class="panel"><h2>Choose a finish available for pickup</h2><div class="actions">${p.finishes.filter(f=>f!=='black').map(f=>button('Switch to '+finishes[f][0],'replace',f==='white'?'primary':'secondary',f)).join('')}</div><div class="actions">${button('Change fulfillment','fulfill','link')} ${button('Back to bag','bag','link')}</div></section></div>${costs('','',true)}</div>`;
}
function review() {
  const method=methods[state.method];
  return heading('Review your order','Check the finish, fulfillment details, and total before confirming.')+
  `<div class="two"><div>${item(true)}<section class="panel"><div class="row"><h2>${method.title}</h2>${button('Change fulfillment','fulfill','link')}</div><p>${method.detail}</p><p>Sample customer: Jordan Reed</p></section></div>${costs('Place simulated order','place')}</div>`;
}
function complete() {
  const method=methods[state.method];
  return heading('Simulated order confirmed','Order SS-1048')+
  `<div class="two"><div><section class="success"><h2>${state.method==='pickup'?'Pickup reserved':'Delivery scheduled'}</h2><p>${method.title} · ${method.detail}</p></section>${item()}<p class="note">This is a practice order. No payment was collected and no item will be shipped or reserved.</p></div>${costs('Start a new session','restart')}</div>`;
}
const screens=[null,catalog,detail,bag,fulfillment,recovery,review,complete];
function render(focus) {
  target.dataset.state='S'+state.screen;
  target.innerHTML=steps()+screens[state.screen]();
  if(focus){
    target.querySelector('h1').focus({preventScroll:true});
    window.scrollTo(0,0);
  }
}
function go(screen) {
  state.screen=screen;
  render(true);
}
function availability() {
  const blocked=state.bag.id==='standard' && state.bag.finish==='black' && state.method==='pickup';
  state.checked=!blocked;
  go(blocked?5:6);
}
function reset() {
  state=initial();
  render(true);
}
const actions={
  reset:()=>{dialog.returnValue='';dialog.showModal();},
  restart:reset,
  browse:()=>go(1),
  view:(id)=>{
    state.draft={id,finish:state.bag?.id===id?state.bag.finish:products[id].finishes[0]};
    state.returnTo=1;
    go(2);
  },
  cancel:()=>go(state.returnTo),
  edit:()=>{
    state.returnTo=state.screen;
    state.draft={...state.bag};
    go(2);
  },
  save:()=>{
    state.bag={...state.draft};
    state.checked=false;
    if(state.returnTo===6){availability();return;}
    go(3);
  },
  bag:()=>go(3),
  fulfill:()=>go(4),
  check:availability,
  replace:finish=>{
    state.bag.finish=finish;
    availability();
  },
  place:()=>{
    if(state.checked){go(7);}
  },
};
document.addEventListener('click',event=>{
  const control=event.target.closest('[data-action]');
  if(control) actions[control.dataset.action](control.dataset.value);
});
target.addEventListener('change',event=>{
  const {name,value}=event.target;
  if(name==='finish') state.draft.finish=value;
  if(name==='method'){
    state.method=value;
    state.checked=false;
  }
  if(name==='finish'||name==='method'){
    render(false);
    target.querySelector(`input[name="${name}"]:checked`).focus();
  }
});
dialog.addEventListener('close',()=>{if(dialog.returnValue==='reset') reset();});
render(false);

</script>
</body>
</html>
