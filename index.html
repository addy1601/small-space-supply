<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An interactive shopping study for comparing and ordering a rolling storage cart.">
    <title>Rolling Carts | Small Space Supply</title>
    <link rel="stylesheet" href="style.css">
    <script src="shop.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div class="shell header">
        <div class="brand">
          <span class="mark" aria-hidden="true">SS</span>
          <span>Small Space Supply<small>Shopping prototype</small></span>
        </div>
        <button class="reset" type="button" data-action="reset">Reset prototype</button>
      </div>
    </header>

    <main class="shell" id="shop"></main>

    <footer class="shell foot">
      <span>Pre-test v1</span>
      <span>Simulated shopping · Product imagery from IKEA</span>
    </footer>

    <dialog id="reset-dialog">
      <form method="dialog">
        <h2>Reset this prototype?</h2>
        <p>This clears your product, finish, and fulfillment choices.</p>
        <div class="actions">
          <button class="secondary" value="cancel" autofocus>Keep shopping</button>
          <button class="primary" value="reset">Reset and start over</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
